<p><button class="big">{{ t("Sign in") }}</button></p>
<table class="hint"><tr><td>salesman_a / sales123</td><td>admin / admin123</td></tr><tr><td>production / prod123</td><td>accountant / acct123</td></tr><tr><td>owner / owner123</td><td>salesman_b / sales123</td></tr></table>
