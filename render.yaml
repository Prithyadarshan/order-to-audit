# Render "Blueprint": New + > Blueprint > pick this repository. Free tiers sleep when idle and the free database expires.
services:
  - type: web
    name: order-to-audit
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: factory-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
databases:
  - name: factory-db
    plan: free
